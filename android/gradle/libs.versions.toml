[versions]
agp = "9.4.0"
androidbrowserhelper = "2.5.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
nanohttpd = "2.3.1"
nanohttpdWebsocket = "2.3.1"
ndefemulationAndroid = "1.0.0"

[libraries]
androidbrowserhelper = { module = "com.google.androidbrowserhelper:androidbrowserhelper", version.ref = "androidbrowserhelper" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpdWebsocket" }
ndefemulation-android = { module = "com.luigivampa92:ndefemulation-android", version.ref = "ndefemulationAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

